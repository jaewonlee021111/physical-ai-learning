[env]
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; esp32-camera는 Arduino 코어에 포함된다. lib_deps로 중복 설치하지 않는다.

[env:scanner]
build_flags = ${env.build_flags} -DLAB_MODE=1
[env:blink]
build_flags = ${env.build_flags} -DLAB_MODE=2
[env:touch]
build_flags = ${env.build_flags} -DLAB_MODE=3
[env:sta]
build_flags = ${env.build_flags} -DLAB_MODE=4
[env:ap]
build_flags = ${env.build_flags} -DLAB_MODE=5
[env:ble]
build_flags = ${env.build_flags} -DLAB_MODE=6
[env:camera]
build_flags = ${env.build_flags} -DLAB_MODE=7
[env:cloud]
build_flags = ${env.build_flags} -DLAB_MODE=8
