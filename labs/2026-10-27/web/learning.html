<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>백엔드 개념 학습</title>
<style>body{font:18px system-ui;max-width:900px;margin:auto;padding:24px;background:#f3f6fb;color:#142539}article,section{padding:18px;background:white;border:1px solid #cbd5e1;border-radius:12px;margin:12px 0}button,input{font:inherit;padding:10px;margin:5px}button{cursor:pointer}#feedback{min-height:3rem}a{color:#164e86}</style>
<h1>백엔드 개념·퀴즈·오답</h1><a href="index.html">API 실습으로</a><p>용어를 외우고 실제 요청과 응답에 연결한다.</p><label>용어 검색 <input id="search" type="search"></label><div id="cards"></div>
<section><h2>개념 확인</h2><p id="question"></p><div id="answers"></div><p id="feedback" role="status"></p><button id="next">다음 문제</button></section><section><h2>오답 노트</h2><p>이 브라우저에 문제 번호만 보관한다.</p><ul id="wrong"></ul><button id="clear">오답 기록 지우기</button></section>
<script>
const terms=[['Endpoint','API 자원과 동작에 접근하는 경로. HTTP 메서드와 함께 해석한다.'],['GET','자원 조회. 조회 요청으로 상태 변경을 만들지 않는다.'],['POST','새 자원 생성·작업 요청.'],['PUT','자원 전체 표현 교체.'],['PATCH','선택한 필드 일부 수정.'],['DELETE','자원 삭제.'],['Path parameter','/items/42의 42처럼 경로에서 지정한 값.'],['Query parameter','?q=cola처럼 검색·필터 조건을 전달하는 값.'],['Request body','생성·수정할 구조화 데이터를 요청 본문에 담음.'],['Response','상태 코드·헤더·본문으로 요청 결과를 전달.'],['JWT','서명·만료 등을 검증하는 토큰. 기본 JWT의 내용은 암호문이 아니다.'],['CORS','브라우저가 다른 origin의 응답을 읽을 수 있도록 서버가 허용 범위를 명시하는 정책. 인증의 대체가 아니다.'],['Depends','FastAPI에서 인증·DB 등 의존성을 주입하는 기능.'],['MQTT','브로커를 통해 토픽에 발행하고 구독하는 메시징 프로토콜.']];
const questions=[['일부 필드만 수정할 때?', ['GET','PATCH','DELETE'],1,'PATCH는 부분 변경이다.'],['/items/42의 42는?', ['Path parameter','Query parameter','Header'],0,'경로 안에 있으므로 Path parameter다.'],['다른 사람의 데이터 수정 방지는?', ['버튼만 숨기기','CORS만 설정','서버에서 소유자 검사'],2,'인증 후에도 요청한 자원의 소유자 권한을 검사해야 한다.'],['JWT의 내용은 기본적으로?', ['암호화돼 아무도 못 읽음','서명과 별개로 읽을 수 있음','항상 서버에만 있음'],1,'서명은 무결성 검증이며 암호화와 다르다.'],['브라우저의 교차 origin 응답 읽기 허용은?', ['CORS','MQTT','SQLite'],0,'CORS는 브라우저 정책이며 API 접근 인증이 아니다.'],['웹에서 LED 요청이 202로 접수됐다면?', ['실제 LED가 켜졌음','보드 적용은 아직 미확인','물리 센서로 검증 완료'],1,'명령 접수와 보드 ACK·실물 확인은 다르다.']];
const $=id=>document.getElementById(id);let i=0;let wrong=[];try{const data=JSON.parse(localStorage.getItem('oct27-wrong')||'[]');if(Array.isArray(data))wrong=data.filter(x=>Number.isInteger(x)&&x>=0&&x<questions.length);}catch{}
function cards(){const q=$('search').value.toLowerCase();$('cards').replaceChildren();for(const [name,meaning]of terms.filter(x=>x.join(' ').toLowerCase().includes(q))){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=name;p.textContent=meaning;a.append(h,p);$('cards').append(a);}}
function notes(){$('wrong').replaceChildren();for(const n of wrong){const li=document.createElement('li');li.textContent=questions[n][0]+' '+questions[n][3];$('wrong').append(li);}try{localStorage.setItem('oct27-wrong',JSON.stringify(wrong));}catch{}}
function render(){const q=questions[i];$('question').textContent=q[0];$('feedback').textContent='';$('answers').replaceChildren();q[1].forEach((a,n)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{for(const x of $('answers').children)x.disabled=true;$('feedback').textContent=(n===q[2]?'정답. ':'다시 확인. ')+q[3];if(n!==q[2]&&!wrong.includes(i))wrong.push(i);notes();};$('answers').append(b);});}
$('search').oninput=cards;$('next').onclick=()=>{i=(i+1)%questions.length;render();};$('clear').onclick=()=>{wrong=[];notes();};cards();render();notes();
</script></html>
