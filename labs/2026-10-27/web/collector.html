<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 수집</title>
<style>body{font:18px system-ui;max-width:1000px;margin:auto;padding:24px;background:#f3f6fb;color:#142539}button,input{font:inherit;padding:10px;margin:5px}button{cursor:pointer}#photos{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;background:white;padding:10px}img{width:180px}#status{min-height:3em}</style>
<h1>카메라 이미지 수집</h1><p>설정된 실제 보드 JPEG를 저장한다. 카메라가 없으면 실패를 표시한다.</p><label>클래스 <input id="label" value="cola" pattern="[A-Za-z0-9_-]+"></label><label>연속 촬영 장수 <input id="count" type="number" min="1" max="1000" value="10"></label><button id="one">한 장 촬영</button><button id="burst">연속 촬영</button><button id="stop">중지</button><button id="refresh">목록</button><button id="zip">클래스 ZIP</button><p id="status" role="status">카메라 연결 미확인</p><div id="photos"></div>
<script>const $=x=>document.getElementById(x);let running=false;const base=()=>'/classes/'+encodeURIComponent($('label').value);async function req(url,method='GET'){const r=await fetch(url,{method});if(!r.ok){let message='HTTP '+r.status;try{message+=' '+(await r.json()).detail;}catch{}throw Error(message);}return r.status===204?null:r.json();}async function refresh(){const data=await req(base());$('photos').replaceChildren();for(const name of data.photos){const figure=document.createElement('figure'),img=document.createElement('img'),button=document.createElement('button');img.src=base()+'/'+name;img.alt=data.label+' 수집 사진';button.textContent='잘못 찍은 사진 삭제';button.onclick=()=>req(base()+'/'+name,'DELETE').then(refresh).catch(fail);figure.append(img,button);$('photos').append(figure);}$('status').textContent=data.label+': '+data.photos.length+'장';}function fail(e){running=false;$('status').textContent='수집 실패: '+e.message;}async function one(){await req(base()+'/capture','POST');await refresh();}$('one').onclick=()=>one().catch(fail);$('burst').onclick=async()=>{if(running)return;running=true;$('label').disabled=true;const count=Math.min(1000,Math.max(1,Number($('count').value)||1));try{for(let i=0;i<count&&running;i++){await one();if(i+1<count)await new Promise(r=>setTimeout(r,1000));}}catch(e){fail(e);}finally{running=false;$('label').disabled=false;}};$('stop').onclick=()=>{running=false;};$('refresh').onclick=()=>refresh().catch(fail);$('zip').onclick=()=>{location.href='/download/'+encodeURIComponent($('label').value);};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();one().catch(fail);}});</script></html>
