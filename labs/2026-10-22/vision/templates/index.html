<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VISION LAB · 10.22</title><link rel="stylesheet" href="/static/style.css">
<body><header><span>PHYSICAL AI / 2026.10.22</span><h1>보고, 처리하고, 확인하기.</h1><p>OpenCV · YOLO · Flask / 로컬 실습 대시보드</p></header>
<main><section class="view"><div class="bar"><h2>실시간 입력</h2><strong id="source">연결 중</strong></div><img class="feed" src="/stream" alt="웹캠 또는 합성 입력 스트림"><p id="error" role="status"></p>
<form id="settings"><label>전처리<select name="mode">{% for mode in modes %}<option>{{ mode }}</option>{% endfor %}</select></label><label>탐지 임계값<input name="confidence" type="number" min="0" max="1" step="0.05" value="0.5"></label><label>N프레임마다 추론<input name="infer_every" type="number" min="1" max="30" value="3"></label><button>설정 적용</button></form><button id="capture">현재 화면 촬영</button><h2>최근 촬영</h2><div id="gallery"></div></section>
<aside><button id="theme" type="button">화면 테마 전환</button><h2>파이프라인 상태</h2><p id="summary">프레임을 기다리고 있습니다.</p><div id="stages"></div><p id="detail">단계를 선택하면 코드 설명이 표시됩니다.</p><h2>탐지 결과</h2><p id="objects"></p><h2>이벤트 로그</h2><button id="pause" type="button">로그 일시정지</button><label>레벨<select id="level"><option>ALL</option><option>INFO</option><option>DEBUG</option><option>WARN</option></select></label><pre id="logs"></pre></aside></main><script src="/static/app.js"></script></body></html>
