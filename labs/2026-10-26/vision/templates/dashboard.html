<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10/26 · Wireless Vision Lab</title><link rel="stylesheet" href="/static/dashboard.css"><body>
<header><span>PHYSICAL AI / 2026.10.26</span><h1>Wireless Vision Lab</h1><p id="connection" role="status">연결 중</p><div id="metrics"></div></header>
<form id="settings"><label>추론 간격 <select name="skip"><option>1</option><option selected>2</option><option>3</option><option>5</option><option>10</option></select></label><label>모델 크기 <select name="imgsz"><option>256</option><option selected>320</option><option>640</option></select></label><label>신뢰도 <input name="conf" type="number" min="0" max="1" step="0.05" value="0.4"></label><button>설정 적용</button><output id="setting-status" aria-live="polite"></output></form>
<main><section><h2>01 / 영상</h2><div class="actions"><button id="toggle">원본 보기</button><button id="capture">촬영</button></div><img id="feed" src="/detect_feed" alt="선택한 소스의 실시간 영상"><p id="capture-status" role="status"></p><div id="captures"></div></section><section><h2>02 / 처리 흐름</h2><svg id="flow" viewBox="0 0 390 510" aria-label="6단계 처리 흐름"></svg><div id="detail" aria-live="polite">노드를 선택하면 실제 함수의 XML 설명을 볼 수 있습니다.</div><h2>03 / 로그</h2><div class="actions"><button id="pause">로그 일시정지</button><button id="clear">지우기</button><label><input type="checkbox" value="INFO" checked class="filter">INFO</label><label><input type="checkbox" value="DEBUG" class="filter">DEBUG</label><label><input type="checkbox" value="WARN" checked class="filter">WARN</label></div><pre id="logs" aria-label="실행 로그"></pre></section></main><footer>합성 입력은 테스트용이며 실제 카메라 검증과 구분합니다.</footer><script src="/static/dashboard.js"></script></body></html>
