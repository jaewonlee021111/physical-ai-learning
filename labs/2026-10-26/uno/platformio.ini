[env]
platform = atmelavr@5.1.0
board = uno
framework = arduino
monitor_speed = 115200
[env:check]
build_flags = -DLAB_MODE=0
[env:rgb]
build_flags = -DLAB_MODE=1
[env:lcd]
build_flags = -DLAB_MODE=2
lib_deps = marcoschwartz/LiquidCrystal_I2C@1.1.4
[env:climate]
build_flags = -DLAB_MODE=3
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    paulstoffregen/Time@1.6.1
[env:joystick]
build_flags = -DLAB_MODE=4
[env:keypad]
build_flags = -DLAB_MODE=5
[env:piano]
build_flags = -DLAB_MODE=6
[env:ir]
build_flags = -DLAB_MODE=7
lib_deps = z3t0/IRremote@4.4.1
[env:sound]
build_flags = -DLAB_MODE=8
